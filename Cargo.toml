[package]
name = "near-tool"
version = "0.2.0"
edition = "2021"
description = "NEAR MPC cross-chain transaction signing and broadcasting tool (WASM component)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
ripemd = { version = "0.1", default-features = false, features = ["std"] }
tiny-keccak = { version = "2", features = ["keccak"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
